# LinuxOSZero GRUB2 Configuration File
set timeout=5
set default=0

# Modern Dark Theme Colors
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan
set color_normal=light-gray/black
set color_highlight=black/light-cyan

menuentry "LinuxOSZero v1.0.0 (Live Graphical Mode / VirtualBox VMSVGA)" --class os {
    linux /boot/vmlinuz quiet splash vboxguest.modeset=1 vga=current
    initrd /boot/initrd.img
}

menuentry "Install LinuxOSZero directly (Graphical Installer Wizard)" --class install {
    linux /boot/vmlinuz quiet zero-install=1 vga=current
    initrd /boot/initrd.img
}

menuentry "LinuxOSZero (Safe Graphics / VESA Mode 1024x768)" --class recovery {
    linux /boot/vmlinuz nomodeset vga=791
    initrd /boot/initrd.img
}

menuentry "LinuxOSZero Rescue Console (Shell Only)" --class terminal {
    linux /boot/vmlinuz single console=tty1
    initrd /boot/initrd.img
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off" {
    halt
}
