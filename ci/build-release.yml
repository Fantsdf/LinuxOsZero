name: Build LinuxOSZero ISO & Release

on:
  push:
    branches:
      - main
      - arena/**
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Bootable ISO & Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make binutils busybox-static python3 xz-utils gzip zip imagemagick

      - name: Compile OS & Build Hybrid ISO
        run: |
          make all
          ./release.sh --verify

      - name: Upload ISO & ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinuxOSZero-v1.1.0-x86_64-release
          path: |
            dist/LinuxOSZero-v1.1.0-x86_64.zip
            dist/LinuxOSZero-v1.1.0-x86_64.iso
            dist/SHA256SUMS
            RELEASE_1.1.md

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LinuxOSZero-v1.1.0-x86_64.zip
            dist/LinuxOSZero-v1.1.0-x86_64.iso
            dist/SHA256SUMS
            RELEASE_1.1.md
          name: LinuxOSZero Titan Edition v1.1.0 (x86_64)
          tag_name: v1.1.0
          draft: false
          prerelease: false
          body_path: RELEASE_1.1.md
